<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e23"><meta name="description" content="Twenty birthday wishes on a fairy-tale journey from Earth to the Moon."><title>For Muno · A Night to Remember</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="style.css?v=15"><script defer src="config.js?v=11"></script><script defer src="letter-writing.js?v=1"></script><script defer src="game.js?v=16"></script></head><body>
<main id="app"><canvas id="scene" aria-label="Earth-to-Moon birthday adventure"></canvas>
<section id="entrance"><div id="greeting" class="gate"><span class="flower">✿</span><h1>Hi Dear.</h1><p>Are you <span id="recipient"></span>?</p><div class="choices"><button id="yes" class="primary">Yes ♡</button><button id="no" class="glass">No</button></div><p id="no-message" class="feedback" aria-live="polite"></p></div>
<form id="secret" class="gate" hidden><span class="flower">♡</span><h1>Our little secret.</h1><label for="answer">What does he call you?</label><input id="answer" placeholder="Your special nickname" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80" required aria-describedby="answer-message"><button id="enter" class="primary" type="submit">Enter our world ✧</button><p id="answer-message" class="feedback" aria-live="polite"></p><button id="back" class="text-button" type="button">Back</button></form></section>
<div id="hud" hidden><button id="journal-button" class="round" aria-label="Open your letters"><span aria-hidden="true">♡</span><small id="letter-count">0/20</small></button><div class="hud-right"><button id="sound" class="round" aria-label="Mute music" aria-pressed="false">♫</button><button id="pause" class="round" aria-label="Pause adventure" aria-pressed="false">Ⅱ</button></div></div>
<div id="controls" hidden><div id="joystick" role="group" aria-label="Hold left or right to walk"><button id="left" aria-label="Walk left">‹</button><button id="right" aria-label="Walk right">›</button><span id="stick" aria-hidden="true">✦</span></div></div>
<button id="action" class="primary action" hidden></button><div id="speech" hidden role="status"></div>
<div id="pause-screen" hidden><button id="resume" class="primary">Continue ♡</button></div>
<dialog id="love-question" aria-labelledby="love-title"><article class="paper"><span class="eyebrow">ONE LAST QUESTION</span><h2 id="love-title">Do you love me?</h2><div class="choices"><button id="love-yes" class="primary">Yes ♡</button><button id="love-no" class="glass">No</button></div><p id="love-plea" aria-live="polite"></p></article></dialog>
<section id="cake-cutting" hidden aria-labelledby="cut-title"><div class="cut-card"><h2 id="cut-title">Time to cut your cake ♡</h2><div id="cake-art" aria-hidden="true"><div class="cake-plate"></div><div class="cake-half"><div class="cake-tiers"><div class="cake-top">♡</div><div class="cake-bottom">✿ &nbsp; ♡ &nbsp; ✿</div></div></div><div class="cake-half"><div class="cake-tiers"><div class="cake-top">♡</div><div class="cake-bottom">✿ &nbsp; ♡ &nbsp; ✿</div></div></div><div class="cake-knife"></div></div><p id="cut-status" role="status"></p><progress id="cut-progress" max="1" value="0" aria-label="Cake cutting progress"></progress><button id="cut-button" class="primary">Hold to cut ♡</button></div></section>
<section id="video-screen" hidden aria-label="Your birthday video"><video id="finale-video" controls playsinline preload="none" aria-label="Birthday surprise video"></video><div class="video-actions"><p id="video-status" role="status"></p><button id="video-play" class="primary" hidden>Play video ♡</button><button id="video-continue" class="glass">Continue ♡</button></div></section>
<section id="ending" hidden><span class="flower">♡</span><h1 id="birthday-title"></h1><p id="birthday-line"></p><div class="choices"><button id="ending-journal" class="glass">Our letters</button><button id="replay" class="glass">Once more ♡</button></div></section>
<dialog id="challenge" aria-labelledby="challenge-title"><article class="paper challenge-paper"><button id="close-challenge" class="close" aria-label="Leave this challenge">×</button><span id="challenge-number" class="eyebrow"></span><h2 id="challenge-title"></h2><p id="challenge-hint"></p><div id="playfield"><canvas id="mini-canvas" aria-hidden="true"></canvas><div id="mini-buttons"></div></div><form id="question-form" hidden><label id="question-label" for="question-answer"></label><input id="question-answer" autocomplete="off" placeholder="Your answer" required maxlength="200" aria-describedby="challenge-status"><button class="primary" type="submit">Unlock my letter ♡</button></form><p id="challenge-status" role="status" aria-live="polite"></p></article></dialog>
<dialog id="letter" aria-labelledby="letter-title"><article class="paper"><button id="close-letter" class="close" aria-label="Close letter">×</button><span id="letter-number" class="eyebrow"></span><h2 id="letter-title"></h2><figure id="photo"><img id="photo-img" alt=""><figcaption id="caption"></figcaption></figure><img id="letter-animation" alt="" hidden><div id="message"></div><p id="signature"></p><button id="continue" class="primary">Keep it in my heart ♡</button></article></dialog>
<dialog id="journal" aria-labelledby="journal-title"><article class="paper"><button id="close-journal" class="close" aria-label="Close memories">×</button><span class="eyebrow">YOURS, ALWAYS</span><h2 id="journal-title">Seven little letters</h2><div id="journal-list"></div><button id="restart" class="text-button">Begin the whole journey again</button><div id="reset-confirm" hidden><p>Start again and clear your collected letters?</p><button id="reset-yes" class="glass">Start again</button><button id="reset-no" class="text-button">Keep my memories</button></div></article></dialog>
<div id="toast" role="status" aria-live="polite"></div><span id="live" class="sr-only" aria-live="polite"></span>
</main></body></html>
